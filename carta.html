<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para mi vida hermosa ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at top, #56345f, #24152d 60%, #120a17);

    color: white;

    overflow-y: auto;
}


/* ESTRELLAS */

.estrella {
    position: absolute;
    color: #ffffff;
    opacity: 0.6;
    animation: brillo 3s infinite ease-in-out;
}

.e1 {
    top: 12%;
    left: 15%;
}

.e2 {
    top: 20%;
    right: 18%;
    animation-delay: 1s;
}

.e3 {
    bottom: 15%;
    left: 20%;
    animation-delay: 2s;
}

.e4 {
    bottom: 20%;
    right: 15%;
    animation-delay: 1.5s;
}

@keyframes brillo {

    0%, 100% {
        opacity: 0.2;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

}


/* CONTENEDOR */

.contenedor {
    text-align: center;
    width: 90%;
    max-width: 700px;
    z-index: 5;

    animation: aparecer 1.2s ease;
}

@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* TITULO */

h1 {
    font-size: 38px;
    font-weight: normal;
    margin-bottom: 10px;
}

.subtitulo {
    font-size: 18px;
    opacity: 0.8;
    margin-bottom: 35px;
}


/* SOBRE */

.sobre {
    width: 280px;
    height: 190px;

    position: relative;

    margin: auto;

    cursor: pointer;

    transition: transform 0.4s ease;
}

.sobre:hover {
    transform: scale(1.05);
}


/* PARTE DEL SOBRE */

.cuerpo {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 135px;

    background: #d8a43a;

    border-radius: 8px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.4);
}


/* PARTE INTERIOR */

.cuerpo::before {

    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-bottom: 90px solid #bd8730;

}


/* SOLAPA */

.solapa {

    position: absolute;

    top: 55px;
    left: 0;

    width: 0;
    height: 0;

    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 90px solid #efc15b;

    z-index: 3;

    transform-origin: top;

    transition: transform 0.8s ease;
}


/* CORAZON */

.corazon {

    position: absolute;

    top: 82px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 38px;

    z-index: 5;

    transition: opacity 0.4s ease;
}


/* SOBRE ABIERTO */

.sobre.abierto .solapa {

    transform: rotateX(180deg);

}

.sobre.abierto .corazon {

    opacity: 0;
}


/* BOTON */

.boton {

    margin-top: 35px;

    padding: 14px 30px;

    border: none;

    border-radius: 30px;

    background: #e7b94e;

    color: #24152b;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.3s ease;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.3);
}

.boton:hover {

    transform: translateY(-3px) scale(1.03);

    background: #f5d174;

}


/* TEXTO PEQUEÑO */

.instruccion {

    margin-top: 15px;

    font-size: 13px;

    opacity: 0.55;
}


/* FLORES */

.flores {

    font-size: 60px;

    margin: 25px;

    animation: flotar 3s infinite ease-in-out;
}

@keyframes flotar {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}


/* CARTA */

.carta {
    
    text-align: left;

    padding: 30px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 20px;

    line-height: 1.8;

    font-size: 18px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

}

.carta p {
    margin-bottom: 20px;
    opacity: 0;
    animation: aparecerTexto 1s ease forwards;
}

.carta p:nth-child(1) {
    animation-delay: 0.3s;
}

.carta p:nth-child(2) {
    animation-delay: 0.8s;
}

.carta p:nth-child(3) {
    animation-delay: 1.3s;
}

.carta p:nth-child(4) {
    animation-delay: 1.8s;
}

.carta p:nth-child(5) {
    animation-delay: 2.3s;
}

.carta p:nth-child(6) {
    animation-delay: 2.8s;
}

.carta p:nth-child(7) {
    animation-delay: 3.3s;
}

.carta p:nth-child(8) {
    animation-delay: 3.8s;
}

.carta p:nth-child(9) {
    animation-delay: 4.3s;
}

.carta p:nth-child(10) {
    animation-delay: 4.8s;
}

@keyframes aparecerTexto {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* CORAZONES */

.corazones {

    font-size: 25px;

    margin-top: 20px;

    letter-spacing: 10px;
}

.decoracion {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.decoracion span {
    position: absolute;
    bottom: -60px;
    font-size: 22px;
    opacity: 0;
    animation: subir 10s linear infinite;
}

.decoracion span:nth-child(1) {
    left: 8%;
    animation-delay: 0s;
}

.decoracion span:nth-child(2) {
    left: 20%;
    animation-delay: 3s;
}

.decoracion span:nth-child(3) {
    left: 35%;
    animation-delay: 6s;
}

.decoracion span:nth-child(4) {
    left: 48%;
    animation-delay: 2s;
}

.decoracion span:nth-child(5) {
    left: 62%;
    animation-delay: 5s;
}

.decoracion span:nth-child(6) {
    left: 75%;
    animation-delay: 1s;
}

.decoracion span:nth-child(7) {
    left: 87%;
    animation-delay: 7s;
}

.decoracion span:nth-child(8) {
    left: 95%;
    animation-delay: 4s;
}

@keyframes subir {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    80% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }

}

@keyframes granFinal {

    0% {
        opacity: 0;
        transform: scale(0.7);
    }

    60% {
        opacity: 1;
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

.musica {
    display: inline-block;

    margin-top: 18px;

    padding: 10px 18px;

    border-radius: 20px;

    color: white;

    text-decoration: none;

    font-size: 14px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.2);

    transition: 0.3s ease;
}

.musica:hover {
    transform: translateY(-2px);

    background: rgba(255,255,255,0.15);
}
</style>

</head>


<body>

<div class="decoracion">

    <span>🌻</span>
    <span>❤️</span>
    <span>✨</span>
    <span>🌻</span>
    <span>❤️</span>
    <span>✨</span>
    <span>🌻</span>
    <span>❤️</span>

</div>

<!-- ESTRELLAS -->

<div class="estrella e1">✦</div>
<div class="estrella e2">✧</div>
<div class="estrella e3">✦</div>
<div class="estrella e4">✧</div>


<!-- CONTENIDO -->

<div class="contenedor" id="contenido">

    <h1>
        Para mi vida hermosa ❤️
    </h1>

    <div class="subtitulo">
        Tengo algo que decirte...
    </div>


    <!-- SOBRE -->

    <div
        class="sobre"
        id="sobre"
        onclick="abrirCarta()"
    >

        <div class="cuerpo"></div>

        <div class="solapa"></div>

        <div class="corazon">
            ❤️
        </div>

    </div>


    <button
        class="boton"
        onclick="abrirCarta()"
    >
        Abrir mi carta 💌
    </button>

<a
    href="https://www.youtube.com/watch?v=6L-IDYXvJ8o"
    target="_blank"
    class="musica"
>
    🎵 Nuestra canción — Telepathy 💜
</a>
    <div class="instruccion">
        Toca el sobre para abrirlo
    </div>

</div>


<script>

function abrirCarta() {

    const sobre = document.getElementById("sobre");

    sobre.classList.add("abierto");


    setTimeout(function() {

        document.getElementById("contenido").innerHTML = `

            <h1>
                20 meses contigo ❤️
            </h1>

            <div class="subtitulo">
                Y todavía siento que fue ayer...
            </div>


            <div class="flores">
                🌻
            </div>


            <p style="font-size:19px;">
                Una historia que comenzó con un simple
                <strong>“Hola”</strong>...
            </p>


            <button
                class="boton"
                onclick="mostrarCarta()"
            >
                Continúa... 💌
            </button>

        `;

    }, 1000);

}


function mostrarCarta() {

    document.getElementById("contenido").innerHTML = `

        <h1>
            Mi vida hermosa ❤️
        </h1>

        <div class="carta">

            <p>
                Mi vida hermosa:
            </p>

            <p>
                Gracias por estos <strong>20 meses a tu lado</strong>.
                ❤️
            </p>

            <p>
                Esta historia está cada vez más y más linda,
                y me hace muy feliz poder seguir compartiendo
                mi vida contigo.
            </p>

            <p>
                Cada beso, cada abrazo me dan vida y alegría
                a mi corazón y a mi alma.
            </p>

            <p>
                Gracias por hacer que nuestra intimidad sea
                tan especial. El ser uno contigo es de las cosas
                más preciosas que he experimentado en esta vida.
            </p>

            <p>
                Ningún placer se compara con esos momentos
                en los que somos tú y yo, consumidos por la
                pasión y el amor.
            </p>

            <p>
                Eres lo más hermoso que me ha pasado y te
                elegiría infinitamente, una y otra vez.
            </p>

            <p>
                Te amo desde aquel primer
                <strong>“Hola, mucho gusto”</strong>.
            </p>

            <p>
                Y qué bonito pensar que aquel primer saludo
                terminó convirtiéndose en una historia que hoy
                lleva <strong>20 meses</strong>.
            </p>

            <p>
                Y deseo de todo corazón que sigamos escribiendo
                muchos capítulos más juntos.
            </p>

            <p>
                <strong>
                    Te amo, mi vida hermosa. ❤️
                </strong>
            </p>

        </div>

        <button
            class="boton"
            onclick="finalCarta()"
        >
            Hay algo más que quiero decirte... ❤️
        </button>

    `;

}

function finalCarta() {

    document.getElementById("contenido").innerHTML = `

        <div class="flores">
            🌻
        </div>

        <h1>
    Si pudiera volver al principio... ❤️
</h1>

<div class="carta" style="text-align:center;">

    <p>
        Si pudiera regresar al día en que todo comenzó...
    </p>

    <p>
        Si pudiera volver a ese primer momento...
    </p>

    <p>
        Volvería a buscarte.
    </p>

    <p>
        Volvería a acercarme.
    </p>

    <p>
        Y volvería a decirte:
    </p>

    <p style="
        font-size: 25px;
        font-style: italic;
    ">
        “Hola...” ❤️
    </p>

    <p>
        Porque después de estos 20 meses,
        sé que te volvería a elegir.
    </p>

    <p>
        Una y otra vez.
    </p>

    <p>
        No importa cuántas veces tuviera que comenzar
        nuestra historia.
    </p>

    <p id="eleccion" style="
        font-size: 28px;
        font-weight: bold;
        opacity: 0;
        animation: granFinal 2s ease forwards;
        animation-delay: 1s;
    ">
        Siempre te elegiría a ti. ❤️
    </p>

</div>

        <div class="corazones">
            ❤️ 🌻 ❤️ 🌻 ❤️
        </div>

        <h2 style="
    margin-top: 40px;
    font-weight: normal;
    opacity: 0;
    animation: aparecerTexto 2s ease forwards;
    animation-delay: 3s;
">
    Feliz 1 año y 8 meses, mi vida hermosa. ❤️
</h2>

<p style="
    opacity: 0;
    font-size: 20px;
    animation: aparecerTexto 2s ease forwards;
    animation-delay: 4.5s;
">
    20 meses contigo...
</p>

<p style="
    opacity: 0;
    font-size: 22px;
    animation: aparecerTexto 2s ease forwards;
    animation-delay: 6s;
">
    y todavía elegiría volver a empezar contigo. 🌻❤️
</p>

    `;

}

</script>


</body>

</html>
